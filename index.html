<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="朋友失踪三天，只留下一个诡异的广告链接。在一台模拟电脑里搜索、翻博客、看源代码，把她找回来。三章灵异网页解谜游戏。"><meta property="og:title" content="静园苗圃"><meta property="og:description" content="种下思念，永不凋零。一个三章的灵异网页解谜游戏。"><meta name="theme-color" content="#1b1d1c">
<title>静园苗圃</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 布局：一台被“借来”的旧电脑 —— 深色浏览器外壳 + 各网站各自的视觉 + 右侧调查笔记 */
:root{
  color-scheme: dark;
  --shell:#1b1d1c; --shell-2:#262927; --shell-line:#353a37;
  --ink:#e6e4dc; --ink-dim:#9a9d97;
  --moss:#7d9b6a; --iris:#8b6fc4; --blood:#b8433a;
  --f-display:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--shell);color:var(--ink);font-family:var(--f-body);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--iris);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;height:100%;max-width:1280px;margin:0 auto}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr);height:auto}}

/* 浏览器 */
.browser{display:flex;flex-direction:column;min-width:0;border:1px solid var(--shell-line);border-radius:10px;overflow:hidden;background:var(--shell-2);min-height:560px}
.tabbar{display:flex;align-items:center;gap:8px;padding:8px 10px 0}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#3d423f;display:block}
.tab{background:var(--shell);padding:7px 14px;border-radius:8px 8px 0 0;font-size:12px;color:var(--ink);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar{display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--shell);border-bottom:1px solid var(--shell-line)}
.tb{background:transparent;border:1px solid transparent;color:var(--ink-dim);border-radius:6px;height:30px;min-width:30px;padding:0 8px;font-size:13px}
.tb:hover{background:var(--shell-2);color:var(--ink)}
.tb:disabled{opacity:.35;cursor:default}
.addr{flex:1;min-width:0;display:flex}
.addr input{flex:1;min-width:0;background:var(--shell-2);border:1px solid var(--shell-line);color:var(--ink);border-radius:15px;height:30px;padding:0 14px;font-family:var(--f-mono);font-size:12.5px}
.viewport{flex:1;overflow:auto;background:#fff;color:#222;position:relative}
.viewport.src{background:#151716;color:#cfd3cc}
.srcview{font-family:var(--f-mono);font-size:12.5px;line-height:1.6;padding:16px 18px;white-space:pre-wrap;word-break:break-all;margin:0}
.srcview .c{color:#9fd18a;background:#7d9b6a22}
.bookmarks{display:flex;gap:4px;flex-wrap:wrap;padding:4px 10px 6px;background:var(--shell);border-bottom:1px solid var(--shell-line)}
.bm{font-size:12px;color:var(--ink-dim);background:none;border:none;padding:3px 8px;border-radius:5px}
.bm:hover{background:var(--shell-2);color:var(--ink)}

/* 侧栏 */
.side{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.side .panel.notes-panel{flex:1;min-height:0;display:flex;flex-direction:column}
.fab{display:none}
@media (max-width:900px){
  .side{position:fixed;left:0;right:0;bottom:0;z-index:45;max-height:78vh;overflow:auto;background:var(--shell);border-top:1px solid var(--shell-line);border-radius:14px 14px 0 0;
    padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px #000a;transform:translateY(105%);transition:transform .25s}
  .side.open{transform:none}
  .side .panel.notes-panel{flex:none}
  .notes{max-height:38vh!important}
  .fab{display:flex;align-items:center;gap:6px;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:46;background:var(--shell-2);color:var(--ink);border:1px solid var(--moss);border-radius:999px;padding:10px 16px;font-size:13px;box-shadow:0 6px 20px #0008}
  .fab b{color:var(--moss)}
  .fab.ping{animation:ping 1s 2}
}
@keyframes ping{50%{transform:scale(1.12);border-color:var(--iris)}}
.panel{border:1px solid var(--shell-line);border-radius:10px;background:var(--shell-2);padding:14px}
.panel h2{font-family:var(--f-display);font-size:15px;margin:0 0 10px;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:baseline}
.panel h2 small{font-family:var(--f-mono);font-size:11px;color:var(--ink-dim);font-weight:400}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;flex:1;min-height:120px;overflow:auto}
.notes .chap{list-style:none;font-family:var(--f-display);font-size:12px;letter-spacing:.2em;color:var(--ink-dim);border:none;padding:6px 0 0}
.notes li{font-size:12.5px;line-height:1.55;padding-left:12px;border-left:2px solid var(--moss);color:var(--ink)}
.notes li.secret{border-left-color:var(--iris)}
.notes li.new{animation:flash 1.2s}
@keyframes flash{from{background:#7d9b6a44}to{background:transparent}}
.notes .empty{border:none;color:var(--ink-dim);padding:0}
.hintbox{font-size:12.5px;line-height:1.6;color:var(--ink-dim);min-height:2em}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{background:var(--shell);border:1px solid var(--shell-line);color:var(--ink);border-radius:6px;padding:6px 12px;font-size:12.5px}
.btn:hover{border-color:var(--moss)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.progress{display:flex;gap:4px;margin-top:4px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--shell-line)}
.progress i.on{background:var(--moss)}
.secretline{font-size:12px;color:var(--ink-dim);margin-top:10px}
.secretline b{color:var(--iris);font-weight:600}

/* 开场 / 结局 遮罩 */
.overlay{position:fixed;inset:0;background:#0d0e0dee;display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.phone{width:100%;max-width:380px;background:#f1f1ee;color:#222;border-radius:22px;padding:18px 14px;box-shadow:0 20px 60px #000a;max-height:100%;overflow:auto}
.phone header{position:sticky;top:-18px;background:#f1f1ee;z-index:1;padding-top:6px;text-align:center;font-weight:700;font-size:15px;padding-bottom:10px;border-bottom:1px solid #ddd;margin-bottom:12px}
.phone header small{display:block;font-weight:400;color:#888;font-size:11px}
.msg{max-width:82%;background:#fff;padding:9px 12px;border-radius:12px;margin:0 0 8px;line-height:1.55;font-size:13.5px;opacity:0;transform:translateY(6px);animation:in .35s forwards}
.msg.me{background:#a5d68b;margin-left:auto}
.msg.sys{background:none;color:#999;font-size:11.5px;text-align:center;max-width:100%}
.msg code{font-family:var(--f-mono);font-size:12px;background:#0001;padding:1px 4px;border-radius:3px;word-break:break-all}
@keyframes in{to{opacity:1;transform:none}}
.phone .go{display:block;width:100%;margin-top:12px;background:#222;color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px}
.ending{max-width:600px;background:#111312;border:1px solid var(--shell-line);border-radius:12px;padding:28px 26px;line-height:1.9;max-height:100%;overflow:auto}
.ending h1{font-family:var(--f-display);font-size:26px;margin:0 0 4px;color:var(--ink);text-wrap:balance}
.ending .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--moss)}
.ending .tag.bad{color:var(--blood)}
.ending .tag.true{color:var(--iris)}
.ending p{color:var(--ink-dim);margin:12px 0}
.ending p.hl{color:var(--ink)}
.choice{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.choice button{text-align:left;background:var(--shell-2);border:1px solid var(--shell-line);color:var(--ink);border-radius:8px;padding:12px 14px;line-height:1.5}
.choice button:hover:not(:disabled){border-color:var(--iris)}
.choice button small{display:block;color:var(--ink-dim);font-size:12px}
.choice button:disabled{opacity:.45;cursor:not-allowed}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.msg{opacity:1;transform:none}}

/* ====== 各网站样式 ====== */
.pg{min-height:100%;font-size:14px;line-height:1.7}
.pg a{color:#1a55c4;cursor:pointer;text-decoration:underline}
.pg input[type=text],.pg input[type=password]{border:1px solid #bbb;border-radius:4px;padding:6px 10px;font-size:14px;min-width:0;width:100%;max-width:260px;background:#fff;color:#222}
.pg .sbtn{border:none;border-radius:4px;padding:7px 16px;font-size:14px}
.err{color:#c22;font-size:13px;min-height:1.4em;margin-top:6px}

/* 寻度搜索 */
.xd{padding:60px 20px;text-align:center;background:#fff}
.xd-logo{font-family:var(--f-display);font-size:46px;font-weight:900;letter-spacing:.06em;color:#2b5fd9}
.xd-logo span{color:#d93b2b}
.xd form{display:flex;justify-content:center;margin:22px auto 10px;max-width:540px}
.xd form input{flex:1;max-width:none!important;border:2px solid #2b5fd9!important;border-radius:8px 0 0 8px!important;height:42px}
.xd form button{background:#2b5fd9;color:#fff;border:none;border-radius:0 8px 8px 0;padding:0 20px}
.xd .hot{font-size:13px;color:#666;max-width:540px;margin:24px auto 0;text-align:left}
.xd .hot ol{padding-left:20px;margin:6px 0}
.xdr{padding:18px 24px;background:#fff;max-width:760px}
.xdr form{display:flex;margin-bottom:18px;max-width:540px}
.xdr form input{flex:1;max-width:none!important;border:2px solid #2b5fd9!important;border-radius:6px 0 0 6px!important}
.xdr form button{background:#2b5fd9;color:#fff;border:none;border-radius:0 6px 6px 0;padding:0 16px}
.res{margin:0 0 20px}
.res .t{font-size:17px}
.res .u{color:#1d7a32;font-size:12.5px;font-family:var(--f-mono)}
.res .d{color:#444;font-size:13.5px}
.res .ad{font-size:11px;border:1px solid #c88;color:#c55;padding:0 4px;border-radius:3px;margin-right:6px}
.res.creep .t{color:#b8433a}

/* 静园苗圃 广告站 */
.jy{background:#eef3e6;color:#2f3a2a}
.jy-hero{background:linear-gradient(160deg,#cfe0b8,#9fbe86 60%,#5f8250);padding:46px 24px 54px;text-align:center;position:relative;overflow:hidden}
.jy-hero h1{font-family:var(--f-display);font-size:clamp(30px,6vw,52px);margin:0;color:#1f3318;letter-spacing:.12em}
.jy-hero p{font-size:16px;margin:8px 0 0;color:#2c4423}
.jy-hero .flower{margin:20px auto 0;width:120px;height:120px}
.jy-sec{max-width:720px;margin:0 auto;padding:28px 22px}
.jy-sec h2{font-family:var(--f-display);font-size:22px;color:#2a4420;margin:0 0 10px}
.jy-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.jy-card{background:#fff;border-radius:10px;padding:14px;border:1px solid #d2dcc4}
.jy-card b{font-family:var(--f-display);font-size:16px}
.jy-card .price{color:#b8433a;font-weight:700}
.jy-ghost{color:#eef3e6}
.jy-ghost::selection{background:#b8433a;color:#fff}
.jy-foot{background:#2a3825;color:#a9b89d;font-size:12px;padding:18px 22px;text-align:center;line-height:1.9}
.jy-btn{background:#b8433a;color:#fff;border:none;border-radius:999px;padding:10px 26px;font-size:15px;margin-top:16px}
@media (max-width:560px){.jy-pop{position:static!important;transform:rotate(-2deg)!important;display:inline-block;margin-bottom:14px}}
.jy-pop{position:absolute;right:14px;top:14px;background:#fffbe9;border:2px dashed #b8433a;padding:8px 12px;font-size:12px;color:#b8433a;transform:rotate(3deg);max-width:170px;text-align:left}
.jy-login{background:#fff;border-radius:12px;max-width:360px;margin:30px auto;padding:22px;border:1px solid #d2dcc4}
.jy-login label{display:block;font-size:13px;margin:10px 0 4px;color:#4a5c40}

/* 小满的博客 */
.bl{background:#fbf4f6;color:#3b3138}
.bl-head{padding:30px 24px 18px;text-align:center;border-bottom:1px dashed #e3c6d0}
.bl-head h1{font-family:var(--f-display);font-size:28px;margin:0;color:#7a4a63}
.bl-head p{margin:4px 0 0;color:#a07a8d;font-size:13px}
.bl-wrap{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:22px;max-width:820px;margin:0 auto;padding:22px}
@media (max-width:640px){.bl-wrap{grid-template-columns:minmax(0,1fr)}}
.post{background:#fff;border-radius:10px;padding:18px 20px;margin-bottom:16px;border:1px solid #f0dbe3}
.post h3{font-family:var(--f-display);margin:0 0 2px;font-size:18px;color:#5c3a4d}
.post time{font-size:12px;color:#b090a0;font-family:var(--f-mono)}
.post p{margin:10px 0 0}
.post .cap{font-size:12px;color:#a07a8d;text-align:center;margin-top:6px}
.bl-side .card{background:#fff;border-radius:10px;padding:14px;border:1px solid #f0dbe3;font-size:13px;margin-bottom:14px}
.bl-side .avatar{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#f6d6c6 0 26%,transparent 27%),radial-gradient(circle at 50% 110%,#c99ab4 0 48%,transparent 49%),radial-gradient(ellipse 7px 4px at 64% 18%,#7a5bb8 70%,transparent 72%),#f5e6ec;margin-bottom:8px}
.iris-pic{height:150px;border-radius:8px;margin-top:10px;background:
  radial-gradient(ellipse 14px 30px at 30% 50%,#7a5bb8 60%,transparent 62%),
  radial-gradient(ellipse 30px 13px at 30% 46%,#9b7fd6 60%,transparent 62%),
  radial-gradient(ellipse 14px 30px at 64% 44%,#6b4ca8 60%,transparent 62%),
  radial-gradient(ellipse 30px 13px at 64% 40%,#a389da 60%,transparent 62%),
  linear-gradient(#0000 55%,#5f8250 55% 57%,#0000 57%),
  linear-gradient(180deg,#dfe9d4,#b6cc9f)}
.diary-lock{max-width:380px;margin:40px auto;background:#fff;border-radius:12px;padding:24px;border:1px solid #f0dbe3;text-align:center}
.diary-lock .q{background:#fbf4f6;border-radius:6px;padding:8px;font-size:13px;margin:12px 0;color:#7a4a63}
.diary{max-width:640px;margin:0 auto;padding:28px 24px;background:repeating-linear-gradient(#fff 0 27px,#eadbe2 27px 28px);font-family:var(--f-display);line-height:28px;color:#3b3138}
.diary h4{margin:28px 0 0;line-height:28px;font-size:14px;color:#a0607e;font-family:var(--f-mono)}
.diary p{margin:0}
.diary .shake{color:#b8433a}

/* 千城网盘 */
.pan{background:#f3f6fa;color:#1f2a37;min-height:100%}
.pan-top{background:#fff;border-bottom:1px solid #dde4ee;padding:12px 20px;font-weight:700;color:#2a6fdb;display:flex;gap:10px;align-items:baseline}
.pan-top small{color:#8a96a6;font-weight:400;font-size:12px}
.pan-box{max-width:420px;margin:40px auto;background:#fff;border:1px solid #dde4ee;border-radius:10px;padding:22px}
.pan-list{max-width:640px;margin:24px auto;background:#fff;border:1px solid #dde4ee;border-radius:10px}
.pan-list .row{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid #eef2f7;flex-wrap:wrap}
.pan-list .row:last-child{border-bottom:none}
.pan-list small{color:#8a96a6;font-family:var(--f-mono);font-size:12px}
.letter{max-width:600px;margin:24px auto;background:#fdfaf1;border:1px solid #e7dfc6;padding:28px 30px;font-family:var(--f-display);line-height:2;color:#3a3226;box-shadow:0 2px 0 #e7dfc6,0 4px 0 #f3eddc}
.letter p{margin:0 0 6px;text-indent:2em}
.letter .sig{text-align:right;text-indent:0}
.kid-photo{max-width:420px;height:260px;margin:24px auto 6px;border-radius:4px;border:10px solid #fff;box-shadow:0 2px 10px #0002;background:
  radial-gradient(ellipse 5% 4% at 58% 24%,#7a5bb8 60%,transparent 62%),
  radial-gradient(ellipse 3% 6% at 58% 24%,#9b7fd6 60%,transparent 62%),
  radial-gradient(circle at 50% 36%,#f0d3be 0 13%,transparent 14%),
  radial-gradient(ellipse 16% 22% at 50% 30%,#4a3426 0 98%,transparent 100%),
  radial-gradient(ellipse 22% 34% at 50% 84%,#d98aa0 0 98%,transparent 100%),
  linear-gradient(#d7cfc0,#b9ad98);filter:sepia(.35)}

/* 千城论坛 */
.bbs{background:#e9edf3;color:#222}
.bbs-top{background:#30507e;color:#fff;padding:10px 18px;font-weight:700;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.bbs-top small{font-weight:400;opacity:.75;font-size:12px}
.bbs-thread{max-width:820px;margin:16px auto;padding:0 14px}
.bbs-title{background:#fff;padding:12px 16px;font-size:17px;font-weight:700;border:1px solid #cdd5e1}
.floor{display:grid;grid-template-columns:110px minmax(0,1fr);background:#fff;border:1px solid #cdd5e1;border-top:none}
@media (max-width:560px){.floor{grid-template-columns:minmax(0,1fr)}.floor .who{border-right:none!important;border-bottom:1px solid #e3e8ef}}
.floor .who{background:#f4f6fa;padding:12px;font-size:12px;color:#30507e;border-right:1px solid #e3e8ef}
.floor .who b{display:block;font-size:13px}
.floor .body{padding:12px 16px;min-width:0}
.floor .meta{font-size:11.5px;color:#999;margin-top:8px}
.floor .del{color:#aaa;font-style:italic}
.bbs-update{background:#f6faf7;border:1px solid #c5d5ca;padding:16px;color:#354b3e}
.bbs-update h2{font-size:16px;margin:0 0 4px}.bbs-update time{font-size:11.5px;color:#6d7d73}
.bbs-update p{margin:10px 0;line-height:1.9}.bbs-update blockquote{margin:14px 0 0;padding:2px 0 2px 14px;border-left:2px solid #91aa98}
.bbs-archive{padding:12px 16px;background:#e6ebf2;color:#667489;font-size:12px;border:1px solid #cdd5e1}

/* 千城新闻 */
.news{background:#fff;color:#1d1d1d}
.news-top{border-bottom:3px solid #b31b1b;padding:12px 22px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.news-top b{font-family:var(--f-display);font-size:22px;color:#b31b1b;letter-spacing:.1em}
.news-top small{color:#888;font-size:12px}
.news-art{max-width:660px;margin:0 auto;padding:24px 22px}
.news-art h1{font-family:var(--f-display);font-size:26px;line-height:1.35;margin:0 0 8px;text-wrap:balance}
.news-art .by{font-size:12.5px;color:#888;margin-bottom:16px}
.news-art p{text-indent:2em;margin:0 0 12px;font-size:15px}
.news-photo{height:190px;border-radius:4px;background:
  radial-gradient(ellipse 2.4% 3.4% at 54% 22%,#7a5bb8 60%,transparent 62%),
  radial-gradient(circle at 50% 30%,#e8cbb4 0 9%,transparent 10%),
  radial-gradient(ellipse 9% 13% at 50% 27%,#3e2b20 0 98%,transparent 100%),
  radial-gradient(ellipse 14% 30% at 50% 74%,#d27a8c 0 98%,transparent 100%),
  radial-gradient(ellipse 4% 11% at 20% 60%,#7a5bb8 60%,transparent 62%),
  radial-gradient(ellipse 4% 11% at 82% 56%,#7a5bb8 60%,transparent 62%),
  linear-gradient(#cfd6c4,#a7b597);filter:grayscale(.45) contrast(.9)}
.news figcaption{font-size:12px;color:#777;margin:6px 0 16px;text-align:center}

/* 陈默的博客 */
.cm{background:#f2f2f0;color:#2b2b2b}
.cm-wrap{max-width:620px;margin:0 auto;padding:36px 22px}

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const norm = s => String(s||'').normalize('NFKC').trim().toLowerCase().replace(/\s+/g,'');
const answer = s => norm(s).replace(/[\p{P}\p{S}]/gu,'');
const digits = s => norm(s).replace(/\D/g,'');

/* ---------- 存档 ---------- */
const KEY = 'jingyuan-save-v2';
const fresh = () => ({notes:[], flags:{}, seenIntro:false, doorFails:0, pendingPhones:[]});
let S = fresh();
try{ const r = localStorage.getItem(KEY); if(r) S = Object.assign(fresh(), JSON.parse(r)); }catch(e){}
if(!Array.isArray(S.pendingPhones)) S.pendingPhones = [];
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
// 兼容旧版过早记为完成的宋芷进度；保留章节、线索及其余存档。
if(S.flags.ch3 && !S.flags.end && S.flags.g_song){ S.flags.g_song = false; save(); }

/* ---------- 声音：全部用 Web Audio 实时合成，不需要音频文件 ---------- */
const SND = (() => {
  let ctx=null, master=null, verbIn=null, nbuf=null, cur=null, curName='';
  let enabled = true;
  const mtof = m => 440*Math.pow(2,(m-69)/12);
  const LULL = [76,79,81,79, 76,74,76,null, 69,72,71,69, 67,64,69,null, null,null,null,null];
  function init(){
    if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = enabled ? .55 : 0; master.connect(ctx.destination);
    const conv = ctx.createConvolver(), len = ctx.sampleRate*3, ib = ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){ const d=ib.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3); }
    conv.buffer = ib; verbIn = ctx.createGain(); verbIn.gain.value = .6; verbIn.connect(conv); conv.connect(master);
    nbuf = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
    const nd = nbuf.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
    if(curName){ const n = curName; curName=''; play(n); }
  }
  function note(dst,f,t,dur,type='sine',vol=.15,atk=.005){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+atk); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(dst); o.start(t); o.stop(t+dur+.05);
  }
  const box = (d,f,t,v=.1) => { note(d,f,t,1.6,'sine',v); note(d,f*4.01,t,.3,'sine',v*.25); note(d,f*2,t,.7,'triangle',v*.12); };
  const piano = (d,f,t,v=.1) => { note(d,f,t,2.4,'triangle',v,.01); note(d,f*2,t,1,'sine',v*.3,.01); };
  function noise(dst,type,freq,q,vol){
    const s=ctx.createBufferSource(); s.buffer=nbuf; s.loop=true;
    const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
    const g=ctx.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(dst); s.start();
    return {node:s, f};
  }
  function drone(dst,f,type,vol,cut){
    const o=ctx.createOscillator(); o.type=type; o.frequency.value=f;
    const fl=ctx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=cut;
    const g=ctx.createGain(); g.gain.value=vol; o.connect(fl); fl.connect(g); g.connect(dst); o.start();
    return {node:o};
  }
  function burst(dst,t,freq,dur,vol,type='bandpass'){
    const s=ctx.createBufferSource(); s.buffer=nbuf;
    const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=2;
    const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+dur*.3); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(dst); s.start(t, Math.random()); s.stop(t+dur+.05);
  }
  function seq(step, fn){
    let i=0, next=ctx.currentTime+.15;
    const id = setInterval(()=>{ if(next < ctx.currentTime) next = ctx.currentTime + .05; while(next < ctx.currentTime+.3){ fn(i++, next); next += step; } }, 60);
    return () => clearInterval(id);
  }
  function lfo(param, rate, depth){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=rate; g.gain.value=depth; o.connect(g); g.connect(param); o.start();
    return {node:o};
  }
  const R = a => a[Math.floor(Math.random()*a.length)];
  const TH = {
    room(o,w,k){ k(noise(o,'lowpass',380,.7,.05)); k(drone(o,50,'sine',.03,200));
      k(seq(6,(i,t)=>{ if(Math.random()<.4) note(w,mtof(R([84,87,91])),t,3,'sine',.012,1); })); },
    ad(o,w,k){ const creep = S.flags.diary;
      const M=[72,76,79,76,77,81,79,null,76,79,84,83,81,77,79,null];
      k(seq(.3,(i,t)=>{ let m=M[i%16]; if(m==null) return; if(creep && i%8===5) m+=6;
        let f=mtof(m); if(creep) f*=Math.pow(2,(Math.random()*90-45)/1200);
        box(o,f,t,.08); box(w,f,t,.035); if(i%4===0) note(o,mtof(m-24),t,1.1,'triangle',.045); }));
      if(creep) k(noise(o,'bandpass',900,1,.012)); },
    blog(o,w,k){ const C=[[65,69,72,76],[64,67,71,74],[62,65,69,72],[60,64,67,71]];
      k(seq(4,(i,t)=>{ C[i%4].forEach(m=>{ note(o,mtof(m),t,4.6,'triangle',.028,1.2); note(w,mtof(m),t,4.6,'sine',.02,1.2); }); }));
      k(seq(1,(i,t)=>{ if(Math.random()<.3) piano(w,mtof(R([76,79,81,84,86])),t,.04); })); },
    lullaby(o,w,k){ k(seq(.62,(i,t)=>{ const m=LULL[i%LULL.length]; if(m!=null){ box(o,mtof(m),t,.06); box(w,mtof(m),t,.08); } }));
      k(noise(o,'lowpass',600,.5,.02)); k(drone(w,mtof(45),'sine',.04,300)); },
    sanpai(o,w,k){ k(seq(.95,(i,t)=>{ const m=LULL[i%LULL.length]; if(m!=null) box(w,mtof(m-12)*Math.pow(2,(Math.random()*60-30)/1200),t,.07); }));
      const n=noise(o,'bandpass',500,1.2,.05); k(n); k(lfo(n.f.frequency,.06,280)); k(drone(o,mtof(33),'sine',.05,200)); },
    rain(o,w,k){ k(noise(o,'highpass',1400,.5,.045)); k(noise(o,'bandpass',420,.6,.03));
      k(seq(.12,(i,t)=>{ if(Math.random()<.25) note(o,1800+Math.random()*2600,t,.05,'sine',.02); }));
      k(drone(w,mtof(45),'triangle',.025,500)); k(drone(w,mtof(52),'triangle',.02,500)); },
    clock(o,w,k){ k(drone(o,73,'sawtooth',.035,170));
      k(seq(1,(i,t)=>{ burst(o,t,i%2?3200:2400,.04,.09,'highpass'); }));
      k(seq(8,(i,t)=>{ piano(w,mtof(R([57,60,64])),t,.03); })); },
    ghost(o,w,k){ const n=noise(o,'bandpass',700,1.4,.06); k(n); k(lfo(n.f.frequency,.07,420));
      k(drone(w,880,'sine',.006,4000)); k(drone(w,931,'sine',.006,4000));
      k(seq(.5,(i,t)=>{ if(Math.random()<.09) burst(w,t,2400+Math.random()*1800,.5+Math.random(),.05);
        if(Math.random()<.03) box(w,mtof(R(LULL.filter(Boolean))-12)*.985,t,.06); })); },
    gardener(o,w,k){ k(drone(o,41,'sawtooth',.06,110)); k(drone(o,41.6,'sawtooth',.06,110)); k(noise(o,'lowpass',200,.5,.02));
      k(seq(1.15,(i,t)=>{ note(o,55,t,.25,'sine',.35,.01); note(o,48,t+.22,.3,'sine',.25,.01); })); },
    letter(o,w,k){ const M=[69,72,76,74,72,71,69,null,65,69,72,71,69,68,69,null];

  </div>
</div>`};
  addNote('diary'); addNote('overheard');
  return { title:'日记 — 小满的秘密花园', haunt:'一 二 三 四 五', on(){
      phone('diary1','小满',['（03:12）别来。','（03:12）她们不让我睡，一直在我耳朵边上数数。','（03:12）不是坏人。她们说她们也在等人来接，等了好多年。','（03:12）阿桃说你在帮我。告诉她我还活着。','（03:12）还活着。']);
    }, html:`
<div class="pg bl">
  <div class="diary">
    <h4>10 月 16 日 · 晴</h4>
    <p>静园好远，下了公交又走了二十分钟。园子比照片里大，全是紫色的花。园长沈阿姨给我倒茶，看见我头上的发卡，手一抖，茶全洒了。</p>
    <p>她问我发卡哪来的。我说从小就戴着。她没说话，转身进了屋，我听见她在里面哭。</p>
    <p>园丁陈叔叔过来，借我的发卡拍了张照片，翻过来又拍了背面。然后给了我会员编号 JY-0613-08，说 08 是我的序号。</p>
    <h4>10 月 16 日 · 下午</h4>
    <p>每株花前都插着一块小木牌。我数了，一共七块，好几块的名字被拔掉了，只剩一个洞。第七块写着“周晴”。</p>
    <p>这个名字我在千城论坛上见过……是不是那个失踪的女孩？</p>
    <h4>10 月 16 日 · 傍晚</h4>
    <p>沈阿姨今天一直拉着我的手，叫我“念念”。她唱了一首歌，我不知道为什么就哭了。我好像听过。</p>
    <p>我想告诉她外婆的信。陈叔叔把我拉开，说沈阿姨心脏不好，受不了刺激，让我今晚先住温室 B。</p>
    <h4>10 月 16 日 · 深夜</h4>
    <p class="shake">门锁上了。手机只有一格信号。</p>
    <p class="shake">我听见陈叔叔在门外打电话：“不能让她们认。认了，警察就会来，就会查到前面那几个。”</p>
    <h4>10 月 18 日 · 凌晨</h4>
    <p>温室里有人。</p>
    <p>不是陈叔叔。我关了手机的灯，就听见花架后面有人在小声数数：一、二、三、四、五。数完了，又从一开始。</p>
    <p>我问是谁。数数停了。过了很久，一个女孩的声音说：“你是第八个吗？”</p>
    <h4>10 月 18 日 · 白天</h4>
    <p>沈阿姨隔着玻璃给我唱歌。就是我记得的那首。“小鸢尾，开紫花，念念睡，妈妈在。”</p>
    <p>我贴着玻璃哭，她也哭。陈叔叔把她拉走了。</p>
    <p>玻璃上有五个手印，是从里面印的。比我的手小一点。我没有碰过那块玻璃。</p>
    <h4>10 月 18 日 · 夜</h4>
    <p class="shake">她们出来了。五个，穿着不同年份的衣服，裙摆上全是泥。她们不吓人，就是很冷。她们挨着我坐，说这样我就不怕了。</p>
    <p class="shake">最小的那个叫宋芷，她说她在这里待了两年。她说第三排的鸢尾为什么开得那么好，因为底下有人。</p>
    <p class="shake">她们说，十月二十日天亮前，陈默会来“移栽”我。她们说，会有人来的，一直有人在看这本日记。</p>
    <p class="shake">是你吗？</p>
    <p class="shake">阿桃，如果你看到这里——</p>
  </div>
</div>`};
};

PAGES['bbs.qiancheng.net/t/4471'] = () => {

  return { title:title+' — 千城论坛', html:`
<div class="pg bbs">
  <div class="bbs-top">千城论坛 <small>本地生活 › 求助</small></div>
  <div class="bbs-thread">
    <div class="bbs-title">${title}</div>
    ${rescued ? `
    ${S.flags.end==='true' ? `<section class="bbs-update" data-story="later" aria-label="周晴后来的近况">
      <h2>后来的一次更新</h2><time>2026-10-28 09:10 · 晴天不下雨</time>
      <p>昨天陪她在医院楼下坐了一会儿。她选了能看见出口的位置，喝了半杯热豆浆。</p>
      <p>回来时路过花店，她没有低头。她说，以后或许还想看看花。我们不着急。</p>
      <p>她让我转告那个一直没留下名字的人：谢谢你。往后不用再守着这条帖子等消息了，也好好睡一觉吧。</p>
    </section>` : ''}
    <section class="bbs-update" data-story="rescued" aria-label="周晴获救后的报平安">
      <h2>楼主更新：她回来了</h2><time>2026-10-20 06:48 · 晴天不下雨</time>
      <p>找到她了。凌晨四点，警察把她从温室 A 带了出来。我现在在医院，打字的手还在抖。快一年了，这条帖子终于可以改标题了。</p>
      <p>谢谢所有还在问的人。请别去苗圃围观，也别再转发她的照片。她现在只想安静地睡一觉。</p>
      <p>她醒了一小会儿，握着我的手，让我替她把几句话留下来：</p>
      <blockquote>
        <p>“别把她们写成害人的东西。门一直从外面锁着，钥匙在那个男人手里。</p>
        <p>“停电的时候，我听见玻璃被轻轻敲了五下。手电筒没电了，可我还是看见了手印，一枚叠着一枚，印在里面。</p>
        <p>“我睡着以后，身上总会多一条花房里的旧毯子。她们的手很凉，毯子也凉，但她们一直陪我等天亮。</p>
        <p>“请把她们的名字也留下来。别只写‘五名失踪者’。”</p>
      </blockquote>
    </section>
    <div class="bbs-archive">以下是原寻人帖，保留当时的留言。</div>` : ''}
    <div class="floor"><div class="who"><b>晴天不下雨</b>楼主</div><div class="body">
      她叫周晴，24 岁。11 月 3 日说收到一个广告，可以免费领养一盆花，就去了城郊一个叫“静园”的苗圃。之后电话就打不通了。报了警，警察去看过，说那里只有一个种花的阿姨和一个帮工，没发现异常。有谁知道那个苗圃的情况吗？
      <div class="meta">2025-11-09 22:14</div></div></div>
    <div class="floor"><div class="who"><b>千城老司机</b>2 楼</div><div class="body">我也收到过那个广告，紫色的花，还写着“特别欢迎独自生活的女性”。这谁敢去？<div class="meta">2025-11-09 23:01</div></div></div>
    <div class="floor"><div class="who"><b>匿名用户</b>3 楼</div><div class="body"><span class="del">该回复已被管理员删除。</span>
      <!-- 原回复：别去了。园长叫沈静，她女儿 2009 年在植物园丢了，人一直不太清醒。但真正管事的不是她，是那个姓陈的帮工，以前当过记者。这几年去过那里的女孩，我知道的就不止一个。 -->
      <div class="meta">2025-11-10 02:47</div></div></div>
    <div class="floor"><div class="who"><b>晴天不下雨</b>楼主</div><div class="body">3 楼你说的是什么？？能私信我吗？<div class="meta">2025-11-10 08:30</div></div></div>
    <div class="floor"><div class="who"><b>园艺爱好者</b>5 楼</div><div class="body">楼主别着急。那个苗圃园长我见过，人挺和气的，说她女儿特别喜欢鸢尾，所以种了一园子。<div class="meta">2025-11-12 14:05</div></div></div>
    <div class="floor"><div class="who"><b>晴天不下雨</b>楼主</div><div class="body">我又去了一次。帮工不让我进温室，说里面在打药。我隔着玻璃好像看见了晴晴的外套。<div class="meta">2025-12-02 19:40</div></div></div>
    <div class="floor"><div class="who"><b>晴天不下雨</b>楼主</div><div class="body">还是没有消息。<div class="meta">2026-03-21 01:12</div></div></div>
    <div class="floor"><div class="who"><b>晴天不下雨</b>楼主</div><div class="body">我最近每天晚上都梦到她。她站在一块玻璃后面，手贴着玻璃，嘴一直在动。我看口型，好像是“第三排”。<div class="meta">2026-08-30 03:40</div></div></div>
    <div class="floor" style="background:#fbf3f2"><div class="who" style="color:#9a3a32"><b>No.06</b>注册于 2024-04-11<br>发帖 1</div><div class="body" style="color:#7a2a24">

    <div class="floor"><div class="who"><b>夜班老刘</b>楼主</div><div class="body">我后来去派出所门口看了一眼那块失踪人口公告栏。<br>那个女孩在上面。<br><a data-href="news.qiancheng.net/missing">千城市公安局 · 未结失踪人口公告</a><div class="meta">2025-02-02 02:02</div></div></div>

    <p>2009 年 9 月 21 日下午，五岁女童沈念随母亲沈静在千城植物园游玩时走失。据沈静回忆，女儿当时在鸢尾花区蹲着看花，她转身接了一个电话，前后不到一分钟，回头时孩子已经不见了。</p>

    <p>如有线索，请联系千城警方。</p>

  <!-- 编辑备注：沈静提到的那通电话是谁打的？记者称“未能核实”。 -->

const canon = u => String(u||'').trim().replace(/^view-source:/i,'').replace(/^https?:\/\//i,'').replace(/^www\./i,'').replace(/\/+$/,'');
function safeDecode(s){ try{ return decodeURIComponent(s); }catch(e){ return s; } }

function resolve(u){
  if(u.startsWith('xundu.com/s?q=')) return searchPage(safeDecode(u.slice(14)));
  const key = Object.keys(PAGES).find(k=>k===u.toLowerCase());
  if(key) return PAGES[key]();
  if(!u.includes('.')) return null;
  return { title:'无法访问此网站', html:`<div class="pg" style="padding:40px 28px;color:#444"><h2 style="margin:0 0 8px">无法访问此网站</h2><p>找不到 <b>${esc(u)}</b> 的服务器。</p><p style="color:#888;font-size:13px">检查地址是否拼写正确，或者用 <a data-href="xundu.com">寻度</a> 搜一下。</p></div>` };
}
function go(url, push=true){
  let u = canon(url);
  let page = resolve(u);
  if(!page){ u = 'xundu.com/s?q=' + url.trim(); page = resolve(u); }
  if(push){ hist = hist.slice(0,hi+1); hist.push(u); hi = hist.length-1; }
  cur = {u, page}; srcMode = false;
  if(S.last !== u){ S.last = u; save(); }
  SND.play(themeFor(u));
  draw();
}
function themeFor(u){
  if(u.startsWith('xundu.com')) return 'room';
  if(u==='jingyuan-miaopu.com/member/welcome') return 'ghost';
  if(u.startsWith('jingyuan-miaopu.com/gardener')) return 'gardener';
  if(u.startsWith('jingyuan-miaopu.com')) return 'ad';
  if(u==='blog.xiaoman.me/diary') return 'lullaby';
  if(u.startsWith('blog.xiaoman.me')) return 'blog';
  if(u.startsWith('pan.')) return 'letter';
  if(u==='bbs.qiancheng.net/t/5203' || u==='news.qiancheng.net/missing') return 'ghost';
  if(u.startsWith('bbs.')) return 'rain';
  if(u.startsWith('news.') || u.startsWith('chenmo.')) return 'clock';
  if(u==='sanpai.net' || u.startsWith('space.qiancheng.net/songzhi')) return 'sanpai';
  if(u.startsWith('mail.')) return 'mail';
  if(u.startsWith('chongwu.') || u.startsWith('bar.') || u.startsWith('hejizaodian.')) return 'blog';
  return 'memory';
}

function savePhones(){

function schedulePhone(delay){

function clearPhones(){

  phoneQ.forEach(p=>{ S.flags['ph_'+p.id] = true; });

function phone(id, who, msgs, unknown=false){

}
/* 像真人一样一条一条打字：先显示“正在输入”，按字数停一会儿再出消息。点一下可快进。 */
function typeChat(box, before, items, opts={}){
  let i = 0, timer = null, done = false;
  const typing = document.createElement('div');
  typing.className = 'msg typing' + (opts.dark ? ' dark' : ''); typing.innerHTML = '<i></i><i></i><i></i>';
  const put = it => { const el = document.createElement('div'); el.className = 'msg ' + (it.cls||''); el.style.animation = 'none'; el.style.opacity = 1; el.style.transform = 'none'; el.innerHTML = it.html; box.insertBefore(el, before); };
  const scroll = () => { (opts.scroller||box).scrollTop = 1e6; };
  const finish = () => { if(done) return; done = true; clearTimeout(timer); typing.remove(); if(opts.onStatus) opts.onStatus(false); if(opts.onDone) opts.onDone(); };
  const wait = it => {
    if(it.cls==='sys') return 500;
    const len = it.html.replace(/<[^>]+>/g,'').length;
    return Math.min(4600, (it.cls==='me' ? 700 : 1000) + len*(opts.slow ? 95 : 70));
  };
  function step(){
    if(done) return;
    if(i >= items.length){ finish(); return; }
    const it = items[i];
    const showTyping = it.cls!=='sys' && it.cls!=='me';
    if(showTyping){ box.insertBefore(typing, before); if(opts.onStatus) opts.onStatus(true); }
    scroll();
    timer = setTimeout(()=>{
      typing.remove(); if(opts.onStatus) opts.onStatus(false);
      put(it); i++; scroll();
      if(showTyping && opts.onMsg) opts.onMsg();
      timer = setTimeout(step, 350 + Math.random()*500);
    }, wait(it));
  }
  step();
  return { skip(){ if(done) return; clearTimeout(timer); typing.remove(); while(i < items.length) put(items[i++]); scroll(); finish(); }, cancel(){ done = true; clearTimeout(timer); typing.remove(); }, get done(){ return done; } };
}
function showPhone(){
  const p = phoneQ[0]; if(!p || S.flags.end || document.querySelector('.toast')) return;
  if(!ov.hidden){ schedulePhone(500); return; }
  const el = document.createElement('div');
  el.className = 'toast' + (p.unknown ? ' unknown' : '');
  el.setAttribute('role','dialog'); el.setAttribute('aria-label', p.who + ' 的消息');
  const idle = p.unknown ? '号码不存在' : '刚刚';
  el.innerHTML = `<header><span>${esc(p.who)}<small>${idle}</small></span><button class="x" aria-label="关闭">×</button></header><div class="tip">点一下对话框可以快进</div>`;
  document.body.appendChild(el);
  SND.sfx('buzz');
  if(p.unknown) glitch();
  const status = el.querySelector('header small'), tip = el.querySelector('.tip');
  const chat = typeChat(el, tip, p.msgs.map(m=>({html:esc(m)})), {
    slow: p.unknown, dark: p.unknown, scroller: el,
    onStatus: on => { status.textContent = on ? (p.unknown ? '……' : '对方正在输入…') : idle; },
    onMsg: () => SND.sfx('tick'),
    onDone: () => { tip.textContent = '点 × 关闭'; },
  });
  phoneChat = chat;
  el.addEventListener('click', e => { if(!e.target.closest('.x')) chat.skip(); });
  el.querySelector('.x').onclick = () => {
    chat.skip(); el.remove(); phoneQ.shift(); phoneChat = null;
    S.flags['ph_'+p.id] = true; savePhones();
    if(PHONE_AFTER[p.id]) PHONE_AFTER[p.id]();
    if(phoneQ.length) schedulePhone(2500);
  };
}

  if(!letter) return '你没有把外婆的信一起发出去。沈静听说她的念念回来了，却没有读到外婆留下的身世与歉意。';

}

function showEnding(kind){
  const e = ENDINGS[kind]();
  if(kind==='true') SND.play('lullaby');
  const btns = [];
  if(e.retry===true) btns.push(['读档重来', ()=>{ S.doorFails = 0; save(); ov.hidden = true; refresh(); }]);
  else if(e.retry==='compose') btns.push(['回去重新发送', ()=>{ delete S.flags.end; S.flags.g_song = false; save(); renderStage(); ov.hidden = true; go('mail.qiancheng.net/compose'); }]);
  else btns.push(['回到电脑', ()=>{ ov.hidden = true; }]);
  btns.push(['从头开始', reset]);
  overlayStory({tag:e.tag, cls:e.cls, title:e.title, body:e.body, hint:e.hint, buttons:btns});
}

}
